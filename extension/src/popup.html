<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>OLX Deal Radar</title>
  <style>
    body {
      width: 340px;
      margin: 0;
      padding: 16px;
      background: #111827;
      color: white;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 13px;
    }
    h1 { font-size: 16px; margin: 0 0 10px; }
    .card { background: rgba(255,255,255,.08); border-radius: 16px; padding: 12px; margin: 10px 0; }
    .muted { color: #9ca3af; }
    button {
      min-height: 34px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.16);
      color: white;
      cursor: pointer;
      font-weight: 800;
    }
    .good { color: #bbf7d0; }
    .bad { color: #fecaca; }
    .neutral { color: #fde68a; }
  </style>
</head>
<body>
  <h1>OLX Deal Radar</h1>
  <div id="content" class="card muted">Open an OLX ad page to scan.</div>
  <button id="options">Options</button>
  <script src="popup.js"></script>
</body>
</html>
